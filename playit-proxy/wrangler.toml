# The name decides the address (<name>.<your-subdomain>.workers.dev) and which Worker `wrangler deploy`
# replaces. This is the name of the Worker the app calls (PlayitPartnerService.DefaultProxyUrl), so
# deploying from here UPDATES it. A different name creates a second Worker at another address that the
# app never calls: if you deploy your own copy, change this and the URL in the app together.
name = "dawn-hall-c5a8"
main = "worker.js"
compatibility_date = "2025-01-01"

# The partner Api-Key is NOT stored here. Set it as a secret (never committed):
#   wrangler secret put PLAYIT_API_KEY
# or via the Cloudflare dashboard: Settings -> Variables and Secrets -> add Secret.

# Per-IP rate limit for create_agent. REQUIRED: the Worker calls env.SETUP_LIMITER.limit() and, if this
# binding is missing, refuses every request (HTTP 500 "proxy not configured") instead of running
# without a limit. namespace_id is any number unique within your account; period must be 10 or 60.
# Needs Wrangler 4.36.0 or later (older versions only knew the [[unsafe.bindings]] form of this).
[[ratelimits]]
name = "SETUP_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }   # max 20 create_agent attempts per IP per minute

# Optional: set APP_TOKEN as a plain var/secret to require the app's X-MCSL-Client header to match it
# (extra noise filter). Leave it unset to stay compatible with older app builds that don't send it.
