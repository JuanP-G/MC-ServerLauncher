# Actualizaciones de versiones con Dependabot.
# Frecuencia mensual y agrupadas, para recibir pocos PR y revisables.
# Las alertas de seguridad de Dependabot son independientes de este fichero.
#
# Regla de la casa: Dependabot solo propone cambios menores y de parche.
# Los saltos mayores (otra versión principal) se hacen a mano, porque cambian
# la API y compilar no demuestra que la interfaz siga igual.
version: 2

updates:
  # Aplicación, tests y grabador de GIF (NuGet)
  - package-ecosystem: "nuget"
    directories:
      - "/McServerLauncher"
      - "/McServerLauncher.Tests"
      - "/promo/recorder"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Un único PR con los cambios menores y de parche del resto de paquetes.
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Avalonia, sus iconos y SkiaSharp se suben a mano y a la vez. Estos
      # paquetes están repartidos en proyectos distintos (app y tests) y
      # Dependabot los actualiza por separado; con versiones distintas el
      # proyecto de tests no carga (Avalonia.Visuals) y no compila.
      - dependency-name: "Avalonia*"
      - dependency-name: "FluentIcons.Avalonia"
      - dependency-name: "SkiaSharp*"
      # Tmds.DBus.Protocol lo fija el csproj a la versión que pide Avalonia.FreeDesktop
      # (0.21.3). La 0.95.x quita tipos (Connection, IMethodHandler) y Avalonia no carga
      # en Linux: la bandeja y los diálogos de archivo dejarían de funcionar, y los tests
      # no lo ven porque ninguno toca D-Bus. Se sube a mano cuando Avalonia lo soporte.
      - dependency-name: "Tmds.DBus.Protocol"
      # Cualquier otro salto mayor, a mano.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Vídeo promocional (Remotion), fuera de la aplicación
  - package-ecosystem: "npm"
    directory: "/promo"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Acciones de los flujos de trabajo
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
