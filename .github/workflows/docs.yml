name: Website and documentation

# Publishes two things to GitHub Pages in a single deployment:
#   /       -> the landing page in web/ (what search engines should index)
#   /docs/  -> the DocFX site (API reference + articles)
# The landing page sits at the root on purpose: it is the page that should rank, and both its
# canonical tag and the sitemap point at that address.
# One-time setup: in the repo, go to Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let an in-progress Pages deployment finish
# (cancelling it mid-way is what causes intermittent "Deployment failed, try again later").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build documentation
        run: docfx docs/docfx.json

      # Regenerates the translations from the Spanish index. Fails if a string in the dictionary is
      # no longer in the HTML, so a half-translated version is never published without anyone
      # noticing.
      - name: Generate translated pages
        run: python web/_i18n/build.py

      - name: Assemble site (landing at the root, docs under /docs/)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _pages | Out-Null
          Copy-Item web\* _pages\ -Recurse -Force
          New-Item -ItemType Directory -Force _pages\docs | Out-Null
          Copy-Item docs\_site\* _pages\docs\ -Recurse -Force
          # Without this, Pages runs the site through Jekyll and drops anything starting with "_"
          New-Item -ItemType File -Force _pages\.nojekyll | Out-Null
          Get-ChildItem _pages | Select-Object Name

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages
          # Required since v4, which stopped including hidden files: without it the .nojekyll above
          # silently falls out of the artifact and Pages runs the site through Jekyll again,
          # dropping everything that starts with "_".
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
