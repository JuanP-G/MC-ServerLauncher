name: Website and documentation

# Publishes two things to GitHub Pages in a single deployment:
#   /       -> the landing page in web/ (what search engines should index)
#   /docs/  -> the DocFX site (API reference + articles)
# La landing va en la raíz a propósito: es la página que debe posicionar, y su
# etiqueta canónica y el sitemap apuntan a esa dirección.
# One-time setup: in the repo, go to Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let an in-progress Pages deployment finish
# (cancelling it mid-way is what causes intermittent "Deployment failed, try again later").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build documentation
        run: docfx docs/docfx.json

      # Regenera las traducciones desde el índice en español. Falla si alguna cadena
      # del diccionario ya no existe en el HTML, para que no se publique una versión
      # a medio traducir sin que nadie se entere.
      - name: Generate translated pages
        run: python web/_i18n/build.py

      - name: Assemble site (landing at the root, docs under /docs/)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _pages | Out-Null
          Copy-Item web\* _pages\ -Recurse -Force
          New-Item -ItemType Directory -Force _pages\docs | Out-Null
          Copy-Item docs\_site\* _pages\docs\ -Recurse -Force
          # Sin esto, Pages pasa el sitio por Jekyll y descarta lo que empieza por "_"
          New-Item -ItemType File -Force _pages\.nojekyll | Out-Null
          Get-ChildItem _pages | Select-Object Name

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages
          # Obligatorio desde la v4, que dejó de incluir los ficheros ocultos: sin esto el
          # .nojekyll de arriba se cae del artefacto en silencio y Pages vuelve a pasar el sitio
          # por Jekyll, descartando todo lo que empieza por "_".
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
