name: Release (Linux AppImage)

# Builds a self-contained Linux x64 AppImage and attaches it to the GitHub release.
# Triggers when a release is published, or manually (pick a tag).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the AppImage to (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libfuse2

      - name: Publish (linux-x64, self-contained)
        run: |
          dotnet publish McServerLauncher/McServerLauncher.csproj \
            -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=false \
            -o publish-linux

      - name: Build AppDir
        run: |
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # App files
          cp -r publish-linux/* "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/McServerLauncher"

          # Icon (convert the .ico to a 256x256 PNG)
          convert "McServerLauncher/Resources/app.ico[0]" -resize 256x256 "$APPDIR/usr/share/icons/hicolor/256x256/apps/mcserverlauncher.png"
          cp "$APPDIR/usr/share/icons/hicolor/256x256/apps/mcserverlauncher.png" "$APPDIR/mcserverlauncher.png"

          # .desktop entry
          cat > "$APPDIR/mcserverlauncher.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MC Server Launcher
          Comment=Manage your Minecraft servers
          Exec=McServerLauncher
          Icon=mcserverlauncher
          Categories=Game;Utility;
          Terminal=false
          EOF
          cp "$APPDIR/mcserverlauncher.desktop" "$APPDIR/usr/share/applications/"

          # AppRun launcher
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/McServerLauncher" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

      # appimagetool is EXECUTED inside the job that builds the binary our users download, so it is
      # part of this release's supply chain. It used to come from the "continuous" tag — a moving
      # target, fetched with no checksum and no signature: whoever controlled that asset controlled
      # what shipped. Now it is a fixed release, verified before it is ever made executable, and a
      # mismatch fails the build instead of running an unknown binary.
      #
      # To move to a newer appimagetool, update both lines together:
      #   gh api repos/AppImage/appimagetool/releases/tags/<VER> \
      #     --jq '.assets[] | select(.name=="appimagetool-x86_64.AppImage") | .digest'
      - name: Build AppImage
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
        run: |
          set -euo pipefail

          url="https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          curl -fsSL "$url" -o appimagetool

          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum --check --status || {
            echo "::error::appimagetool no coincide con el SHA-256 fijado. Se aborta:"
            echo "  esperado: ${APPIMAGETOOL_SHA256}"
            echo "  obtenido: $(sha256sum appimagetool | cut -d' ' -f1)"
            exit 1
          }
          echo "appimagetool ${APPIMAGETOOL_VERSION} verificado."

          chmod +x appimagetool
          # --appimage-extract-and-run: unpacks instead of mounting, so the job doesn't depend on
          # whichever libfuse the runner image happens to ship.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir MC-ServerLauncher-x86_64.AppImage

      # Its own checksum file, not a line appended to SHA256SUMS.txt: this job and the two macOS
      # ones run in parallel, and three writers on one asset would race. The app needs it because
      # the in-app updater refuses to install anything it cannot verify.
      - name: Checksum
        run: sha256sum MC-ServerLauncher-x86_64.AppImage > MC-ServerLauncher-x86_64.AppImage.sha256

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          gh release upload "$TAG" \
            MC-ServerLauncher-x86_64.AppImage \
            MC-ServerLauncher-x86_64.AppImage.sha256 \
            --clobber --repo "${{ github.repository }}"
