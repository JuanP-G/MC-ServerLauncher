name: Tests

on:
  # Every branch, not just main and release/**: a working branch with no tests run on it is exactly
  # where you don't find out something broke until after you have merged it.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: dotnet test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. Several of these exercise real sockets, named pipes and file locks,
        # and .NET implements those differently on each platform — a named pipe is a Unix domain
        # socket on Linux. Testing on one would leave the other's behaviour assumed, and the app
        # ships on both.
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore McServerLauncher.Tests/McServerLauncher.Tests.csproj

      - name: Build
        run: dotnet build McServerLauncher.Tests/McServerLauncher.Tests.csproj -c Release --no-restore

      - name: Run the tests
        run: dotnet test McServerLauncher.Tests/McServerLauncher.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  # The translated pages are generated from web/index.html and web/_i18n/strings.json and committed.
  # Edit the source without running the generator and the pages everyone reads are quietly a version
  # behind (the hashes in ?v= included). Regenerate on a clean checkout: any difference is the failure.
  web-pages:
    name: generated web pages are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Regenerate
        run: python3 web/_i18n/build.py

      - name: Nothing may have changed
        run: |
          if [ -n "$(git status --porcelain -- web)" ]; then
            git status --short -- web
            git --no-pager diff --stat -- web
            echo "::error::web/ is out of date: run 'python web/_i18n/build.py' and commit the result"
            exit 1
          fi
