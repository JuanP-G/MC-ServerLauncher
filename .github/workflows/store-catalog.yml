name: Store catalogue

# Builds the catalogue the app downloads: for each popular Modrinth project, which topic it is about
# and a one-sentence summary in the five languages the app speaks. A decision model (Cloudflare's
# Clef) picks the topic and checks the summaries, and a small text model writes them.
# See tools/store-catalog/build_catalog.py.
#
# The result lives on the `catalog` branch (main stays clean), as one commit that is replaced on
# every run: the catalogue is a few megabytes of generated data, and a year of daily copies would be
# hundreds of them. The app reads
#   https://raw.githubusercontent.com/JuanP-G/MC-ServerLauncher/catalog/store-catalog.json.gz
#
# It costs nothing. Cloudflare Workers AI gives every account 10,000 neurons a day and, on the free
# plan, stops answering when they are spent instead of charging. The run spends at most 9,000 and
# picks up where it stopped the next day: only projects that are new, or whose text changed, are
# asked about. The first fill of a couple of thousand projects therefore takes a few days.
#
# Two secrets, from a Cloudflare API token with the "Workers AI" permission (Read is enough):
#   CLOUDFLARE_ACCOUNT_ID   the account's id (right side of the dashboard home page)
#   CLOUDFLARE_API_TOKEN    the token
# Without them the job says so and succeeds, so the schedule can stay on before they exist.
#
# When the models or the questions change the run first measures them against the hand-labelled
# projects (tools/store-catalog/golden_set.json) and publishes nothing if accuracy falls under 80 %.

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Projects per kind, most downloaded first'
        default: '2000'

permissions:
  contents: write

concurrency:
  group: store-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test the pipeline
        run: python -m unittest discover -s tools/store-catalog

      - name: Check out the catalog branch (created on first run)
        run: |
          if git ls-remote --exit-code --heads origin catalog >/dev/null 2>&1; then
            git fetch origin catalog
            git worktree add catalog-data origin/catalog
            git -C catalog-data checkout -B catalog
          else
            git worktree add --detach catalog-data
            git -C catalog-data checkout --orphan catalog
            git -C catalog-data rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/store-catalog/build_catalog.py build --out catalog-data --limit "${{ inputs.limit || '2000' }}"

      - name: Publish as a single commit
        working-directory: catalog-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Vercel builds every branch and its project's root directory is `web`. A data branch
          # without that folder fails there on every push ("Root Directory does not exist"); with a
          # stub the project's ignored build step, which skips this branch, gets to run instead.
          mkdir -p web
          echo "Placeholder so Vercel finds its root directory. Nothing is built from this branch." > web/README.md
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            # Replaces the branch's one commit: the data is regenerated, its history is not worth keeping.
            git checkout --orphan catalog-next
            git commit -m "catalog: $(date -u +%F)"
            git branch -M catalog
            git push --force origin catalog
          fi
